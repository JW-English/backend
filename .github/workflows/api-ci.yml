name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'purut-api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'purut-api/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: purut-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers 가 실제 Postgres/Redis 를 띄운다 (ubuntu 러너에 Docker 내장)
      - name: Build & test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: purut-api/api/build/reports/tests/test
          retention-days: 7

      # OpenAPI 스펙은 클라이언트 타입의 소스다. 계약이 깨지면 여기서 드러난다.
      - name: Export OpenAPI spec
        run: |
          # postgres·redis 만 띄운다. MinIO 는 앱 기동에 필요 없고(S3 클라이언트는
          # 실제 호출 때 연결한다), minio/minio 이미지를 Docker Hub 에서 더 이상
          # 받을 수 없어 compose 전체를 올리면 여기서 깨진다
          docker compose up -d postgres redis

          ./gradlew :api:bootRun --args='--spring.profiles.active=local' > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health > /dev/null && break
            sleep 2
          done

          # 기동에 실패하면 curl 만 보고는 원인을 알 수 없다. 로그를 남긴다
          if ! curl -fsS http://localhost:8080/v3/api-docs -o openapi.json; then
            echo "::error::앱이 기동하지 않아 OpenAPI 를 뽑지 못했습니다"
            tail -50 /tmp/app.log
            exit 1
          fi
          kill %1 || true

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: purut-api/openapi.json
          retention-days: 14
