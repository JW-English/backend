# 운영 구성. Lightsail 서울 2GB VM 한 대에 전부 올린다.
#
# 로컬 docker-compose.yml 과 다른 점:
#   - postgres/redis 포트를 호스트에 열지 않는다. 컨테이너 네트워크 안에서만 붙는다
#   - 이미지를 GHCR 에서 받는다. VM 에서 Gradle 을 돌리면 2GB 램으로는 OOM 이 난다
#   - 메모리 상한을 명시한다. 하나가 폭주하면 전부 같이 죽는다
#
# 사용:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  # TLS 발급·갱신을 알아서 한다. 인증서 갱신을 잊어서 서비스가 끊기는 사고를 없앤다
  caddy:
    image: caddy:2-alpine
    container_name: jungwoon-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 .env 에 지정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 발급받은 인증서. 날아가면 재발급 한도에 걸린다
      - caddy-config:/config
    depends_on:
      - api
      - admin
    mem_limit: 128m

  api:
    image: ghcr.io/jw-english/jungwoon-api:${API_TAG:-latest}
    container_name: jungwoon-api
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 네트워크 기준 주소. .env 의 값보다 우선한다
      DB_URL: jdbc:postgresql://postgres:5432/jungwoon
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  admin:
    image: ghcr.io/jw-english/jungwoon-admin:${ADMIN_TAG:-latest}
    container_name: jungwoon-admin
    restart: unless-stopped
    environment:
      # 브라우저에서 부르는 주소라 컨테이너 이름이 아니라 공개 도메인이어야 한다
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      PORT: "3000"
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine
    container_name: jungwoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jungwoon
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d jungwoon"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 320m

  redis:
    image: redis:7-alpine
    container_name: jungwoon-redis
    restart: unless-stopped
    # presigned URL 캐시라 날아가도 다시 만들면 그만이지만,
    # 재시작마다 전부 새로 발급하면 R2 호출이 튄다
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 96m

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
