spring:
  application:
    name: jungwoon-api
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jungwoon}   # 로컬 compose 포트
    username: ${DB_USERNAME:jungwoon}
    password: ${DB_PASSWORD:jungwoon}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}   # 인스턴스 수 x 풀 크기 <= DB max_connections

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마의 단일 소스는 Flyway. 절대 update 로 바꾸지 않는다.
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  threads:
    virtual:
      enabled: true             # Java 21 가상 스레드로 I/O 대기 처리

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful            # 롤링 배포 중 요청 유실 방지
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never       # 외부에 내부 구성 요소를 노출하지 않는다

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jungwoon:
  version: ${APP_VERSION:dev}
  jwt:
    # 운영에서는 반드시 환경변수로 주입한다. 아래 기본값은 로컬 전용이다.
    secret: ${JWT_SECRET:local-only-secret-please-change-in-production-32bytes+}
    access-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
  storage:
    # 로컬은 MinIO, 운영은 Cloudflare R2 — 코드는 동일하고 엔드포인트·키만 바뀐다
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:jungwoon-media}
    access-key: ${STORAGE_ACCESS_KEY:jungwoon}
    secret-key: ${STORAGE_SECRET_KEY:jungwoon-dev-secret}
    path-style-access: ${STORAGE_PATH_STYLE:true}   # MinIO 는 필수, R2 도 지원
    upload-url-ttl: 10m
    download-url-ttl: 1h

  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    com.jungwoon: INFO
