# p6spy 설정 (개발 환경 전용).
# local 프로파일에서 datasource 를 jdbc:p6spy:... 로 바꿀 때만 동작한다.

# 실행 시간과 함께 한 줄로 출력한다
appender=com.p6spy.engine.spy.appender.Slf4JLogger
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(sqlSingleLine)

# 커밋/롤백 같은 잡음은 빼고 실제 쿼리만 본다
excludecategories=info,debug,result,resultset,batch,commit,rollback

# 파라미터가 ? 대신 실제 값으로 찍힌다 — 이게 p6spy 를 쓰는 가장 큰 이유다
databaseDialectDateFormat=yyyy-MM-dd HH:mm:ss
