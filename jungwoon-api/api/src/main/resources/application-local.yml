# 로컬 개발 프로파일. docker compose up -d 로 postgres/redis 를 띄운 뒤 사용한다.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.jungwoon: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # 바인딩 파라미터 확인 (운영에서는 절대 켜지 않는다)

springdoc:
  swagger-ui:
    enabled: true

jungwoon:
  cors:
    # 로컬 전용 패턴. 운영(application-prod)에는 정확한 도메인만 넣는다.
    allowed-origins:
      - http://localhost:[*]       # 관리자 웹(3000), Expo 웹(8081)
      - http://127.0.0.1:[*]
      - http://192.168.*:[*]       # 같은 공유기의 실기기·다른 PC
      - http://172.*:[*]
