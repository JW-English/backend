# 로컬 개발 프로파일. docker compose up -d 로 postgres/redis 를 띄운 뒤 사용한다.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.jungwoon: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # 바인딩 파라미터 확인 (운영에서는 절대 켜지 않는다)

springdoc:
  swagger-ui:
    enabled: true

jungwoon:
  cors:
    allowed-origins:
      - http://localhost:3000    # 관리자 웹
      - http://localhost:8081    # Expo 웹 (개발 확인용)
