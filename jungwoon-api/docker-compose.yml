# 로컬 개발용 인프라. 앱은 IDE 또는 ./gradlew :api:bootRun 으로 띄운다.
# 호스트 포트는 5433/6380 — 5432/6379 는 다른 프로젝트가 쓰고 있어 충돌을 피했다.
# 다른 포트를 쓰려면 POSTGRES_PORT / REDIS_PORT 환경변수로 덮어쓴다.
services:
  postgres:
    image: postgres:16-alpine
    container_name: jungwoon-postgres
    environment:
      POSTGRES_DB: jungwoon
      POSTGRES_USER: jungwoon
      POSTGRES_PASSWORD: jungwoon
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungwoon -d jungwoon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jungwoon-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 개발용 S3 호환 스토리지. 운영은 Cloudflare R2 로 가고,
  # 코드는 AWS SDK 그대로라 엔드포인트·키만 바꾸면 된다.
  minio:
    image: minio/minio:latest
    container_name: jungwoon-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jungwoon
      MINIO_ROOT_PASSWORD: jungwoon-dev-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # 웹 콘솔 (브라우저로 업로드 확인용)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 버킷 생성만 하고 끝나는 일회성 컨테이너
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jungwoon jungwoon-dev-secret &&
      mc mb --ignore-existing local/jungwoon-media &&
      echo '버킷 준비 완료: jungwoon-media'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
