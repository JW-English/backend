// 외부 시스템 어댑터: R2(S3 호환) 스토리지, Redis, 소셜 로그인 API, Expo Push
dependencies {
    api project(':common')
    api project(':domain')      // Provider 등 도메인 enum 을 어댑터 계약에 쓴다

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Apple·Google 의 id_token(JWT) 검증. JWKS 조회·캐시·키 회전·서명 검증을
    // NimbusJwtDecoder 가 처리한다. 직접 짜면 alg 혼동 공격과 키 회전을 놓치기 쉽다
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation "software.amazon.awssdk:s3:${awsSdkVersion}"
    implementation "software.amazon.awssdk:s3-transfer-manager:${awsSdkVersion}"
}
