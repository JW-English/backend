plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':domain')
    implementation project(':infra')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Boot 4 부터 Flyway 자동설정은 별도 모듈(spring-boot-flyway)에 들어있다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    // 개발 환경 전용 쿼리 로깅. 운영 jar 에는 들어가지 않는다
    compileOnly "p6spy:p6spy:${p6spyVersion}"
    developmentOnly "p6spy:p6spy:${p6spyVersion}"

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.security:spring-security-test'
    // id_token 검증 테스트에서 직접 서명한 JWT 를 만든다. infra 가 implementation 으로
    // 들고 있어 여기까지 전파되지 않는다. nimbus 를 직접 적으면 BOM 이 버전을
    // 관리하지 않아 해석에 실패하므로 같은 스타터를 쓴다
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'   // Boot 4: MockMvc 자동설정
    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('bootRun') {
    // 작업 디렉터리를 저장소 루트로 고정한다.
    // 기본값은 이 모듈(api/)이라 루트에 둔 .env 를 못 찾는다
    workingDir = rootProject.projectDir
}
